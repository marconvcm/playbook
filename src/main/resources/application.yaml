spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/playbook
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jakarta.persistence.schema-generation.database.action: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

frontend:
  enabled: true
  workdir: ./app
  command: ["bun", "run", "dev"]
  port: 3000
  startup-timeout-seconds: 30
  ping-path: /app/api/health

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

