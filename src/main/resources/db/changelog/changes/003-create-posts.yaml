databaseChangeLog:
  - changeSet:
      id: 003-create-posts
      author: codex
      changes:
        - createSequence:
            sequenceName: posts_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: group_id
                  type: BIGINT
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: user_id
            constraintName: fk_posts_user_id
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: parent_id
            constraintName: fk_posts_parent_id
            referencedTableName: posts
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: group_id
            constraintName: fk_posts_group_id
            referencedTableName: groups
            referencedColumnNames: id
        - createIndex:
            tableName: posts
            indexName: idx_posts_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: posts
            indexName: idx_posts_parent_id
            columns:
              - column:
                  name: parent_id
        - createIndex:
            tableName: posts
            indexName: idx_posts_group_id
            columns:
              - column:
                  name: group_id
