databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: codex
      changes:
        - createSequence:
            sequenceName: users_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: handle
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_salt
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: roles
                  type: TEXT[]
                  constraints:
                    nullable: false
              - column:
                  name: access_token
                  type: VARCHAR(1024)
              - column:
                  name: refresh_token
                  type: VARCHAR(1024)
              - column:
                  name: api_token
                  type: VARCHAR(1024)
              - column:
                  name: system_user
                  type: BOOLEAN
              - column:
                  name: token_created_at
                  type: TIMESTAMP
              - column:
                  name: token_expires_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP
              - column:
                  name: disabled_at
                  type: TIMESTAMP
              - column:
                  name: last_login_at
                  type: TIMESTAMP
        - createIndex:
            tableName: users
            indexName: idx_users_handle
            columns:
              - column:
                  name: handle
        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email
        - createIndex:
            tableName: users
            indexName: idx_users_access_token
            columns:
              - column:
                  name: access_token
